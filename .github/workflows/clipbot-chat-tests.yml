name: Clip Bot chat tests

on:
  push:
    branches: [clipbot-dev]
  pull_request:
    branches: [main]

jobs:
  chat-highlights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q studio tests
      - name: Chat and facecam unit tests
        run: python -m unittest tests.test_chat_highlights tests.test_facecam -v
      - name: Check dashboard JavaScript
        run: |
          node --check web/clipbot-layout.js
          python -c 'from pathlib import Path; t=Path("web/index.html").read_text(); Path("/tmp/clipbot-inline.js").write_text(t.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/clipbot-inline.js
