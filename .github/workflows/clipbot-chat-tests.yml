name: Clip Bot chat tests

on:
  push:
    branches: [clipbot-dev]
  pull_request:
    branches: [main]

jobs:
  chat-highlights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q studio tests
      - name: Chat highlight unit tests
        run: python -m unittest tests.test_chat_highlights -v
